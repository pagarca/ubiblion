; ubiblion - ebook reader on an ESP8266 + WeAct e-paper (SSD1681)
;
; 4MB flash split as ~1MB program + 3MB LittleFS for the books
; (eagle.flash.4m3m.ld). The firmware itself is only ~435KB, so there's no
; real cost to giving LittleFS the lion's share -- the ESP8266 Arduino core's
; 4mXm ldscripts all reserve the same ~1020KB program partition regardless of
; X, they just differ in where the filesystem starts, so 4m2m (2MB FS) was
; leaving a full megabyte of flash completely unused between the two.
;
; The filesystem image (the data/ folder) is uploaded separately with:
;   pio run -t uploadfs
;
; Two ESP8266 environments:
;   nodemcuv2  normal build
;   dev        development mode: WiFi always on at boot, plus /api/debug/*
;              endpoints to drive and inspect the device from the web.
;              Build with:  pio run -e dev -t upload
;
; And the ESP32 twin (DevKitC / NodeMCU-32S, 4MB, WeAct e-paper on the VSPI
; pins -- the wiring is in src/pins.h and generated as SVG by
; tools/make_pinout.py):
;   esp32dev   normal build
;   dev_esp32  development mode, same /api/debug/* endpoints
;
; See partitions_ubiblion.csv for the ESP32 flash split (1MB app + ~3MB
; LittleFS, like the ESP8266's eagle.flash.4m3m.ld). The ESP32 keeps the
; serial port full-duplex -- the RX-as-button trick is ESP8266-only.
;
; On-device UI languages (English, Spanish, French, German, Italian, Catalan)
; are each controlled by a UBIBLION_LANG_* flag below, 1 to include, 0 to
; leave out. All six are on by default. Dropping languages you don't need
; trims their string tables out of the firmware binary -- see
; [env:nodemcuv2_en] for an example single-language slim build, useful on
; tighter flash budgets.
;
; The web UI (data/index.html) is translated the same way but lives in
; LittleFS, not in the firmware binary; see docs/development.md for how UBIBLION_WEB_LANGS
; controls which languages get bundled into it at build time.

[env]
platform = espressif8266
board = nodemcuv2
framework = arduino

extra_scripts = pre:tools/pio_build_web.py

board_build.filesystem = littlefs

; ESP8266-only: the 4MB split (~1MB program + 3MB LittleFS). Only the
; ESP8266 envs below set it; the ESP32 ones use partitions_ubiblion.csv
; instead, because the ldscript would break their linker (it's an 8266-only
; file).

monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, time

build_flags =
	-DUBIBLION_VERSION=\"1.1.0\"
	-DUBIBLION_LANG_EN=1
	-DUBIBLION_LANG_ES=1
	-DUBIBLION_LANG_FR=1
	-DUBIBLION_LANG_DE=1
	-DUBIBLION_LANG_IT=1
	-DUBIBLION_LANG_CA=1

lib_deps =
	zinggjm/GxEPD2@^1.6.0
	adafruit/Adafruit GFX Library@^1.11.9
	olikraus/U8g2_for_Adafruit_GFX@^1.8.0
	bblanchon/ArduinoJson@^7.0.4

[env:nodemcuv2]
board_build.ldscript = eagle.flash.4m3m.ld
build_flags = ${env.build_flags} -DUBIBLION_DEV=0

; 1MB app + ~2.94MB LittleFS -- see partitions_ubiblion.csv. No
; -DUBIBLION_TARGET_ESP32 needed: the code keys off the core's own
; ARDUINO_ARCH_ESP32 macro (via src/compat.h).
[env:esp32dev]
platform = espressif32@^6.11.0
board = esp32dev
board_build.filesystem = littlefs
board_build.partitions = partitions_ubiblion.csv
build_flags = ${env.build_flags} -DUBIBLION_DEV=0
monitor_filters = esp32_exception_decoder, time

; Deliberately no build_type = debug: the development binary should behave
; like the normal one (same optimizations, same RAM use).
[env:dev]
board_build.ldscript = eagle.flash.4m3m.ld
build_flags = ${env.build_flags} -DUBIBLION_DEV=1

; Same as [env:dev], on the ESP32.
[env:dev_esp32]
platform = espressif32@^6.11.0
board = esp32dev
board_build.filesystem = littlefs
board_build.partitions = partitions_ubiblion.csv
build_flags = ${env.build_flags} -DUBIBLION_DEV=1
monitor_filters = esp32_exception_decoder, time

; Example slim build: English only, on-device UI strings for the other five
; languages never get compiled in. Swap the UBIBLION_LANG_* flags for whatever
; subset you actually need. Remember to also set UBIBLION_WEB_LANGS=en when
; building the web UI (see docs/development.md) if you want the filesystem image to
; match.
[env:nodemcuv2_en]
board_build.ldscript = eagle.flash.4m3m.ld
build_flags =
	-DUBIBLION_VERSION=\"1.1.0\"
	-DUBIBLION_DEV=0
	-DUBIBLION_LANG_EN=1
	-DUBIBLION_LANG_ES=0
	-DUBIBLION_LANG_FR=0
	-DUBIBLION_LANG_DE=0
	-DUBIBLION_LANG_IT=0
	-DUBIBLION_LANG_CA=0
